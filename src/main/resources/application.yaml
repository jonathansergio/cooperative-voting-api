spring:
  application:
    name: cooperative-voting-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/voting}
    username: ${DATABASE_USER:voting}
    password: ${DATABASE_PASSWORD:voting}
    hikari:
      # Medido, não chutado: 30 entrega 19% mais votos por segundo que 20, e mantém a apuração
      # com folga dentro do orçamento de 300ms. Ver docs/adr/0008.
      maximum-pool-size: ${DATABASE_POOL_SIZE:30}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  flyway:
    enabled: true

voting:
  screens:
    # As telas devolvem URLs absolutas para os botões. O emulador e um aparelho físico não alcançam
    # o servidor pelo mesmo endereço, então o domínio é configurável, como o enunciado pede.
    base-url: ${SCREENS_BASE_URL:http://localhost:8080}
  eligibility:
    # `remote` talks to the real registry; `stub` answers that everyone may vote. The upstream in the
    # brief is a free-tier host that is likely offline, so local and CI runs use the stub.
    mode: ${ELIGIBILITY_MODE:remote}
    base-url: ${ELIGIBILITY_BASE_URL:https://user-info.herokuapp.com}
    connect-timeout: ${ELIGIBILITY_CONNECT_TIMEOUT:2s}
    read-timeout: ${ELIGIBILITY_READ_TIMEOUT:3s}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
