spring:
  application:
    name: cooperative-voting-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/voting}
    username: ${DATABASE_USER:voting}
    password: ${DATABASE_PASSWORD:voting}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
