name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts its own PostgreSQL; the runner already has Docker.
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    # Slow; kept off the critical path so a failing build reports fast.
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitest-report
          path: target/pit-reports/
          if-no-files-found: ignore

  evaluator-path:
    name: evaluator path
    runs-on: ubuntu-latest
    # Exactly what an evaluator does: build the image, start the stack, run the Postman collection.
    # It catches a broken image or a collection that drifted from the API before anyone else does.
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack from this source
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Run the Postman collection
        run: >-
          docker run --rm --network host
          -v "$PWD/docs/postman:/etc/newman"
          postman/newman:alpine
          run cooperative-voting-api.postman_collection.json --color off
      - name: Show the API log
        if: failure()
        run: docker compose logs app
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
